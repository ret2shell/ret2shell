name: Web

on:
  push:
    paths:
      - ".github/workflows/web.yml"
      - "web/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/web.yml"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -leo pipefail {0}
        working-directory: web

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v3
        with:
          cache: true
          working-directory: web
          require-lockfile: true # --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload artifact
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  check:
    name: Check
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -leo pipefail {0}
        working-directory: web

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v3
        with:
          cache: true
          working-directory: web
          require-lockfile: true # --frozen-lockfile

      - name: Biome check
        run: pnpm check

      - name: Run tests
        run: pnpm test
