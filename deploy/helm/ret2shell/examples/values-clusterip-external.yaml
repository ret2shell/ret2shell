platform:
  exposure:
    type: clusterIP
  config:
    server:
      # Public hostname served by your Gateway / HTTPRoute.
      externalDomain: ctf.example.com

postgresql:
  mode: external
  external:
    host: postgresql.example.com
    port: 5432
    database: ret2shell
    username: ret2shell
    password: replace-me
    sslMode: disable

valkey:
  mode: external
  external:
    url: redis://:replace-me@valkey.example.com:6379/0

nats:
  mode: external
  external:
    host: nats.example.com
    port: 4222
    token: replace-me
    tls: false

registry:
  mode: disabled

victoriaLogs:
  mode: disabled
