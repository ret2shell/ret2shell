apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ret2shell.fullname" . }}-test-connection"
  labels:
    {{- include "ret2shell.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['http://{{ include "ret2shell.fullname" . }}:{{ .Values.service.port }}{{ .Values.server.apiBasePath }}/ping']
  restartPolicy: Never
